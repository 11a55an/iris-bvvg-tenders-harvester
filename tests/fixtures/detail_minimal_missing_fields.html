<html>

<div class="property-details panel panel-default">

        <li class="list-group-item">
            <div class="row">
                <div class="dt col-sm-5">Objekt-Nr.</div>
                <div class="dd col-sm-7">ZZ00-0000-000000</div>
            </div>
        </li>
        <li class="list-group-item">
            <div class="row">
                <div class="dt col-sm-5">Bundesland</div>
                <div class="dd col-sm-7">Sachsen</div>
            </div>
        </li>
        <li class="list-group-item">
            <div class="row">
                <div class="dt col-sm-5">Objektart</div>
                <div class="dd col-sm-7">Acker und Grünland</div>
            </div>
        </li>
    </ul>
</div>

    <ul class="list-group">
        <li class="list-group-item">
            <div class="row">
                <div class="dt col-sm-6">Angaben zur Abgabe folgen</div>
            </div>
        </li>
    </ul>
</div>
