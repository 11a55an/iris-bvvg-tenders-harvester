services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: iris
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
    ports:
      - "5432:5432"
    volumes:
      - bvvg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bvvg_postgres_data:
